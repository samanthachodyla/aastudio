<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Evryday — Clean, Botanical Hair Care & Dry Shampoo</title>
    <meta
      name="description"
      content="My Evryday makes clean, plant-based hair care for real, everyday routines — starting with a waterless dry shampoo that refreshes roots and revives volume between washes."
    />
    <meta name="author" content="My Evryday" />
    <link rel="canonical" href="https://myevryday.com/" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#472e21" />
    <meta name="apple-mobile-web-app-title" content="My Evryday" />

    <!-- Fonts: Archivo (display) + Tinos (serif body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph / Twitter -->
    <meta property="og:title" content="My Evryday — Clean, Botanical Hair Care" />
    <meta
      property="og:description"
      content="Naturally better hair days. Clean, plant-based essentials built for real routines — starting with our waterless dry shampoo."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://myevryday.com/" />
    <meta property="og:image" content="https://myevryday.com/me-og.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="My Evryday" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Evryday — Clean, Botanical Hair Care" />
    <meta
      name="twitter:description"
      content="Naturally better hair days. Clean, plant-based hair care built for real routines."
    />
    <meta name="twitter:image" content="https://myevryday.com/me-og.svg" />

    <!-- Structured data: Organization / Brand -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "My Evryday",
        "url": "https://myevryday.com/",
        "logo": "https://myevryday.com/favicon.svg",
        "description": "Clean, botanical hair care for everyday routines, including waterless dry shampoo.",
        "sameAs": ["https://www.instagram.com/myevryday_/", "https://jaespace.squarespace.com/shop"]
      }
    </script>

    <!-- Structured data: flagship product -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "ME Dry Shampoo",
        "brand": { "@type": "Brand", "name": "My Evryday" },
        "category": "Hair Care",
        "description": "A weightless, plant-based dry shampoo that absorbs excess oil at the root and revives volume — no water, no residue, no white cast.",
        "url": "https://jaespace.squarespace.com/shop"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
