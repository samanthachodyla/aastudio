<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="Allegory Art Studio — daily check-in dashboard">
  <defs>
    <style>
      .d{font-family:'Cormorant Garamond',Georgia,serif}
      .b{font-family:'Work Sans',system-ui,sans-serif}
      .eye{font-family:'Work Sans',system-ui,sans-serif;letter-spacing:3px}
    </style>
  </defs>
  <rect width="1200" height="820" fill="#f5f3ee"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="232" height="820" fill="#f0ede6"/>
  <line x1="232" y1="0" x2="232" y2="820" stroke="#d8d2c6"/>
  <text x="30" y="66" class="d" font-size="30" fill="#11281c">allegory</text>
  <text x="31" y="84" class="eye" font-size="8" fill="#6b746d">ART STUDIO</text>
  <rect x="0" y="150" width="3" height="22" fill="#11281c"/>
  <text x="30" y="166" class="b" font-size="15" font-weight="600" fill="#11281c">Today</text>
  <text x="30" y="206" class="b" font-size="15" fill="#6b746d">Inventory</text>
  <text x="30" y="246" class="b" font-size="15" fill="#6b746d">Sales &amp; Finance</text>
  <text x="30" y="286" class="b" font-size="15" fill="#6b746d">Opportunities</text>
  <text x="30" y="326" class="b" font-size="15" fill="#6b746d">Contacts</text>
  <text x="30" y="366" class="b" font-size="15" fill="#6b746d">Profile Vault</text>
  <text x="30" y="406" class="b" font-size="15" fill="#6b746d">Communications</text>
  <text x="30" y="446" class="b" font-size="15" fill="#6b746d">Marketing</text>
  <text x="30" y="486" class="b" font-size="15" fill="#6b746d">Studio Manager</text>
  <!-- main -->
  <text x="290" y="112" class="eye" font-size="13" fill="#6b746d">DAILY CHECK-IN · JULY 8</text>
  <text x="288" y="182" class="d" font-size="58" fill="#11281c">Today, in the studio.</text>
  <text x="290" y="222" class="b" font-size="16" fill="#6b746d">Quiet observations from across your practice — what needs your</text>
  <text x="290" y="246" class="b" font-size="16" fill="#6b746d">attention before you get back to the work.</text>
  <!-- morning brief -->
  <rect x="290" y="292" width="850" height="196" rx="3" fill="#ffffff" stroke="#d8d2c6"/>
  <line x1="290" y1="344" x2="1140" y2="344" stroke="#d8d2c6"/>
  <text x="314" y="325" class="eye" font-size="12" fill="#6b746d">THE MORNING BRIEF</text>
  <text x="1116" y="325" text-anchor="end" class="d" font-size="15" font-style="italic" fill="#6b746d">advisory, not just organized</text>
  <text x="314" y="396" class="b" font-size="17" fill="#2c533f">$</text>
  <text x="348" y="396" class="b" font-size="16" fill="#11281c">1 unpaid invoice awaiting payment.</text>
  <text x="1116" y="396" text-anchor="end" class="eye" font-size="12" fill="#11281c">OPEN ↗</text>
  <line x1="290" y1="424" x2="1140" y2="424" stroke="#efece4"/>
  <text x="314" y="462" class="b" font-size="17" fill="#6b746d">$</text>
  <text x="348" y="462" class="b" font-size="16" fill="#11281c">$1,500 earned · $325 in expenses · $1,175 net this month.</text>
  <!-- to-do -->
  <rect x="290" y="516" width="850" height="272" rx="3" fill="#ffffff" stroke="#d8d2c6"/>
  <line x1="290" y1="560" x2="1140" y2="560" stroke="#d8d2c6"/>
  <text x="314" y="543" class="eye" font-size="12" fill="#6b746d">TO-DO</text>
  <rect x="314" y="582" width="700" height="46" rx="2" fill="#f5f3ee" stroke="#d8d2c6"/>
  <text x="332" y="611" class="b" font-size="15" fill="#9a9086">Add a to-do…</text>
  <rect x="1030" y="582" width="86" height="46" rx="2" fill="#8a9589"/>
  <text x="1073" y="611" text-anchor="middle" class="b" font-size="14" fill="#ffffff">+ Add</text>
  <rect x="314" y="656" width="20" height="20" rx="3" fill="none" stroke="#6b746d"/>
  <text x="348" y="672" class="b" font-size="16" fill="#11281c">Call Cara</text>
  <line x1="290" y1="700" x2="1140" y2="700" stroke="#efece4"/>
  <rect x="314" y="716" width="20" height="20" rx="3" fill="none" stroke="#6b746d"/>
  <text x="348" y="732" class="b" font-size="16" fill="#11281c">Follow up with VMFA</text>
  <rect x="1" y="1" width="1198" height="818" fill="none" stroke="#d8d2c6" stroke-width="2"/>
</svg>
