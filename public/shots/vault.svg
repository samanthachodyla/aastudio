<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-label="Allegory Art Studio — Profile Vault">
  <defs>
    <style>
      .d{font-family:'Cormorant Garamond',Georgia,serif}
      .b{font-family:'Work Sans',system-ui,sans-serif}
      .eye{font-family:'Work Sans',system-ui,sans-serif;letter-spacing:3px}
    </style>
  </defs>
  <rect width="1200" height="820" fill="#f5f3ee"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="232" height="820" fill="#f0ede6"/>
  <line x1="232" y1="0" x2="232" y2="820" stroke="#d8d2c6"/>
  <text x="30" y="66" class="d" font-size="30" fill="#11281c">allegory</text>
  <text x="31" y="84" class="eye" font-size="8" fill="#6b746d">ART STUDIO</text>
  <text x="30" y="166" class="b" font-size="15" fill="#6b746d">Today</text>
  <text x="30" y="206" class="b" font-size="15" fill="#6b746d">Inventory</text>
  <text x="30" y="246" class="b" font-size="15" fill="#6b746d">Sales &amp; Finance</text>
  <text x="30" y="286" class="b" font-size="15" fill="#6b746d">Opportunities</text>
  <text x="30" y="326" class="b" font-size="15" fill="#6b746d">Contacts</text>
  <rect x="0" y="350" width="3" height="22" fill="#11281c"/>
  <text x="30" y="366" class="b" font-size="15" font-weight="600" fill="#11281c">Profile Vault</text>
  <text x="30" y="406" class="b" font-size="15" fill="#6b746d">Communications</text>
  <text x="30" y="446" class="b" font-size="15" fill="#6b746d">Marketing</text>
  <text x="30" y="486" class="b" font-size="15" fill="#6b746d">Studio Manager</text>
  <!-- main -->
  <text x="290" y="104" class="eye" font-size="13" fill="#6b746d">PROFILE VAULT</text>
  <text x="288" y="174" class="d" font-size="44" fill="#11281c">The materials you reach for,</text>
  <text x="288" y="220" class="d" font-size="44" fill="#11281c">always current.</text>
  <text x="290" y="272" class="b" font-size="16" fill="#6b746d">Statements, bios, and CVs — versioned, labelled, export-ready.</text>
  <rect x="908" y="150" width="232" height="52" rx="2" fill="#11281c"/>
  <text x="1024" y="182" text-anchor="middle" class="b" font-size="14" fill="#f5f3ee">+  New artist statement</text>
  <!-- tabs -->
  <text x="290" y="326" class="b" font-size="15" font-weight="600" fill="#11281c">Artist statement  2</text>
  <rect x="288" y="340" width="150" height="2" fill="#11281c"/>
  <text x="470" y="326" class="b" font-size="15" fill="#6b746d">Bio  0</text>
  <text x="560" y="326" class="b" font-size="15" fill="#6b746d">CV / Résumé  1</text>
  <text x="720" y="326" class="b" font-size="15" fill="#6b746d">Press &amp; Publications  0</text>
  <line x1="290" y1="342" x2="1140" y2="342" stroke="#d8d2c6"/>
  <!-- cards -->
  <rect x="290" y="380" width="408" height="330" rx="2" fill="#ffffff" stroke="#d8d2c6"/>
  <rect x="732" y="380" width="408" height="330" rx="2" fill="#ffffff" stroke="#d8d2c6"/>
  <text x="318" y="428" class="d" font-size="26" fill="#11281c">Press Release Statement</text>
  <text x="318" y="454" class="eye" font-size="10" fill="#6b746d">UPDATED JUL 8, 2026</text>
  <text x="318" y="492" class="b" font-size="14" fill="#6b746d">After relocating to Charleston, she pursued her</text>
  <text x="318" y="514" class="b" font-size="14" fill="#6b746d">artistic craft full time and established her</text>
  <text x="318" y="536" class="b" font-size="14" fill="#6b746d">permanent studio. Libaire's work has been</text>
  <text x="318" y="558" class="b" font-size="14" fill="#6b746d">featured in Vogue, Brides, and Garden &amp; Gun.</text>
  <rect x="318" y="640" width="3" height="20" fill="#d8d2c6"/>
  <text x="332" y="656" class="d" font-size="15" font-style="italic" fill="#6b746d">PR for Magazines</text>
  <text x="760" y="428" class="d" font-size="26" fill="#11281c">Artist Statement</text>
  <text x="760" y="454" class="eye" font-size="10" fill="#6b746d">UPDATED JUL 8, 2026</text>
  <text x="760" y="492" class="b" font-size="14" fill="#6b746d">Lia Burke Libaire is a Charleston based visual</text>
  <text x="760" y="514" class="b" font-size="14" fill="#6b746d">artist and designer. She began her career in</text>
  <text x="760" y="536" class="b" font-size="14" fill="#6b746d">New York City, translating her love of art and</text>
  <text x="760" y="558" class="b" font-size="14" fill="#6b746d">architecture into the world of interior design.</text>
  <rect x="760" y="640" width="3" height="20" fill="#d8d2c6"/>
  <text x="774" y="656" class="d" font-size="15" font-style="italic" fill="#6b746d">Used on Website</text>
  <rect x="1" y="1" width="1198" height="818" fill="none" stroke="#d8d2c6" stroke-width="2"/>
</svg>
